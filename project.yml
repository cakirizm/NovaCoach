name: NovaCoach
options:
  bundleIdPrefix: com.cakirizm
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.10
targets:
  NovaCoach:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NovaCoach
    resources:
      - path: NovaCoach/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cakirizm.novacoach
        PRODUCT_NAME: NovaCoach
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 0.2.0
    info:
      path: NovaCoach/Info.plist
      properties:
        CFBundleDisplayName: NovaCoach
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
